<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — To-Do List Application</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div>
        <h1>TaskFlow</h1>
        <p class="subtitle">Organize your daily activities efficiently</p>
      </div>
      <button id="theme-toggle" class="theme-btn" aria-label="Toggle Dark Mode">
        <span id="theme-icon">🌙</span>
        <span id="theme-text">Dark Mode</span>
      </button>
    </header>

    <!-- Task Counters -->
    <section class="stats-grid" aria-label="Task Statistics">
      <div class="stat-card">
        <span class="stat-label">Total Tasks</span>
        <span id="total-count" class="stat-value">0</span>
      </div>
      <div class="stat-card pending-card">
        <span class="stat-label">Pending</span>
        <span id="pending-count" class="stat-value">0</span>
      </div>
      <div class="stat-card completed-card">
        <span class="stat-label">Completed</span>
        <span id="completed-count" class="stat-value">0</span>
      </div>
    </section>

    <!-- Task Input / Edit Form -->
    <section class="form-card">
      <h2 id="form-heading">Add New Task</h2>
      <form id="task-form" novalidate>
        <input type="hidden" id="edit-task-id" />

        <div class="form-group full-width">
          <label for="task-title">Task Description *</label>
          <input
            type="text"
            id="task-title"
            placeholder="What needs to be done?"
            autocomplete="off"
          />
          <small id="validation-error" class="error-msg" role="alert"></small>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-category">Category</label>
            <select id="task-category">
              <option value="Work">Work</option>
              <option value="Study">Study</option>
              <option value="Personal">Personal</option>
              <option value="Coding">Coding</option>
              <option value="Health">Health</option>
            </select>
          </div>

          <div class="form-group">
            <label for="task-priority">Priority</label>
            <select id="task-priority">
              <option value="Medium">Medium</option>
              <option value="High">High</option>
              <option value="Low">Low</option>
            </select>
          </div>

          <div class="form-group">
            <label for="task-due-date">Due Date</label>
            <input type="date" id="task-due-date" />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="primary-btn">Add Task</button>
          <button type="button" id="cancel-edit-btn" class="secondary-btn hidden">
            Cancel Edit
          </button>
        </div>
      </form>
    </section>

    <!-- Search & Filter Controls -->
    <section class="controls-card">
      <div class="search-box">
        <input
          type="text"
          id="search-input"
          placeholder="Search tasks by title or category..."
          aria-label="Search tasks"
        />
      </div>

      <div class="filter-group">
        <select id="filter-status" aria-label="Filter by status">
          <option value="All">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="Completed">Completed</option>
        </select>

        <select id="filter-category" aria-label="Filter by category">
          <option value="All">All Categories</option>
          <option value="Work">Work</option>
          <option value="Study">Study</option>
          <option value="Personal">Personal</option>
          <option value="Coding">Coding</option>
          <option value="Health">Health</option>
        </select>

        <select id="filter-priority" aria-label="Filter by priority">
          <option value="All">All Priorities</option>
          <option value="High">High Priority</option>
          <option value="Medium">Medium Priority</option>
          <option value="Low">Low Priority</option>
        </select>
      </div>
    </section>

    <!-- Task List -->
    <section class="tasks-section">
      <ul id="task-list" class="task-list"></ul>
      <div id="empty-state" class="empty-state">
        <p>No tasks match your view. Add a new task above to get started!</p>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
